<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;overflow:hidden}
.sm{box-sizing:border-box;--frame:#F7F7F7;--plate:#FFFFFF;--soft:#F7F7F7;--overlay:rgba(255,255,255,.9);--text:#1D1D1F;--text-2:rgba(0,0,0,.6);--text-3:rgba(0,0,0,.4);--hover:rgba(0,0,0,.035);--active:rgba(0,0,0,.06);--line:rgba(0,0,0,.08);--line-strong:rgba(0,0,0,.11);--accent:#3B5BFD;--accent-soft:rgba(59,91,253,.10);--accent-wash:rgba(59,91,253,.07);--success:#2F8F5B;--guide:rgba(0,0,0,.09);--shadow-plate:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);--shadow-pop:0 0 0 1px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.12);--shadow-bar:0 0 0 1px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);--scrim:rgba(0,0,0,.18);--mock:#F2F2F3;--mock-2:#E8E8EA;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1.4;color:var(--text);-webkit-font-smoothing:antialiased}
.sm.dark{--frame:#141414;--plate:#1F1F1F;--soft:#191919;--overlay:rgba(38,38,38,.92);--text:#EDEDED;--text-2:rgba(255,255,255,.62);--text-3:rgba(255,255,255,.4);--hover:rgba(255,255,255,.05);--active:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);--accent-soft:rgba(91,120,255,.18);--accent-wash:rgba(91,120,255,.14);--guide:rgba(255,255,255,.08);--shadow-plate:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--shadow-pop:0 0 0 1px rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.5);--shadow-bar:0 0 0 1px rgba(255,255,255,.08),0 4px 14px rgba(0,0,0,.4);--scrim:rgba(0,0,0,.45);--mock:#2A2A2C;--mock-2:#333336}
.sm *{box-sizing:border-box}
:where(.sm) button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;cursor:pointer;text-align:left}
.sm svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:relative;display:flex;gap:8px;padding:8px;background:var(--frame);overflow:hidden}
.plate{flex:1;min-width:0;position:relative;display:flex;background:var(--plate);border-radius:14px;box-shadow:var(--shadow-plate);overflow:hidden}
.rail{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.rail .x-ib{width:36px;height:36px;border-radius:999px}
.rail .sep{width:20px;height:1px;background:var(--line);margin:4px 0}
.x-ib{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.x-ib.on{background:var(--active);color:var(--text)}
.x-ib.wash{background:var(--accent-soft);color:var(--accent)}
.x-ib.dark{background:var(--text);color:var(--plate)}
.x-kbd{font-size:11px;line-height:16px;padding:0 4px;border-radius:4px;background:var(--active);color:var(--text-2)}
.side{width:252px;flex:none;margin:6px 0 6px 6px;border-radius:12px;background:var(--soft);padding:4px 6px 6px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.side.float{position:absolute;z-index:4;left:10px;top:58px;bottom:10px;margin:0;background:var(--overlay);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:var(--shadow-pop);border-radius:14px}
.sh{height:32px;width:100%;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;margin-top:6px;border-radius:10px;font-size:12px;color:var(--text-2)}
.sh b{font-weight:600;color:var(--text)}
.sh .n{color:var(--text-3)}
.sh .acts{margin-left:auto;display:flex;gap:2px}
.sh .x-ib{width:26px;height:26px}
.sh .x-ib svg.i{width:14px;height:14px}
.sh.hov{background:var(--hover)}
.row{height:34px;width:100%;flex:none;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 8px;white-space:nowrap;font-size:13px;position:relative}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12px;color:var(--text-3)}
.row.lift{background:var(--plate);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);font-weight:500}
.sm.dark .row.lift{background:#2A2A2A;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.row.hov{background:var(--hover)}
.row .grip{opacity:.5;margin-left:auto}
.row svg.i{color:var(--text-2)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--text-3);flex:none;margin:0 4px}
.dot.on{background:var(--accent)}
.dot.run{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.cv{width:12px;height:12px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3)}
.cv svg.i{width:12px;height:12px;stroke-width:2.2}
.tile{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF;background:var(--c)}
.tile svg.i{width:12px;height:12px;stroke-width:2;color:#FFFFFF!important}
.box svg.i{color:var(--text-3)}
.tree{flex:1;min-height:0;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.lock-note{font-size:12px;color:var(--text-3);padding:2px 10px 6px}
.empty{margin:4px 4px 0;padding:14px 12px;border-radius:10px;background:var(--hover);display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2)}
.empty b{font-size:13px;font-weight:600;color:var(--text)}
.foot{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:1px}
.sw{display:inline-flex;margin-left:auto}
.sw span{width:12px;height:12px;border-radius:999px;box-shadow:0 0 0 2px var(--soft);margin-left:-3px}
.field{flex:1;min-width:0;position:relative;overflow:hidden;background-color:var(--plate);background-image:radial-gradient(var(--guide) 1px,transparent 1px);background-size:18px 18px}
.bar{height:40px;display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--plate);box-shadow:var(--shadow-bar)}
.bar .x-ib{width:32px;height:32px;border-radius:999px}
.bar .vr{width:1px;height:18px;background:var(--line);margin:0 4px}
.pick{height:32px;padding:0 8px 0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.pick .cv{color:var(--text-2)}
.pick.on{background:var(--active)}
.pick .sub{font-weight:400;color:var(--text-3)}
.x-seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--active);gap:2px}
.x-seg button{height:28px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.x-seg button.on{background:var(--plate);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sm.dark .x-seg button.on{background:#333}
.top{position:absolute;z-index:3;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.top > *{pointer-events:auto}
.top .sp{flex:1}
.low{position:absolute;z-index:3;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px}
.job{height:40px;display:inline-flex;align-items:center;gap:10px;padding:0 4px 0 14px;border-radius:999px;background:var(--plate);box-shadow:var(--shadow-bar);font-size:13px;white-space:nowrap}
.job .m{color:var(--text-3)}
.job .pulse{width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stage{position:absolute;transform-origin:0 0}
.ttl{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.ttl span{color:var(--text-3);font-weight:500}
.lbl{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600;margin:28px 0 10px}
.lbl span{font-size:12px;font-weight:400;color:var(--text-3)}
.frames{display:flex;gap:28px}
.fr{display:flex;flex-direction:column;gap:8px}
.fr .cap{font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.fr .cap .chip{height:20px;padding:0 8px;border-radius:999px;background:var(--active);font-size:11px;font-weight:500;color:var(--text);display:inline-flex;align-items:center}
.scr{border-radius:16px;background:var(--plate);box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.06);overflow:hidden;position:relative;display:flex;gap:14px;padding:18px}
.mk{border-radius:10px;background:var(--mock)}
.mk2{border-radius:6px;background:var(--mock-2)}
.col{display:flex;flex-direction:column;gap:10px}
.sel{position:absolute;border-radius:12px;background:var(--accent-wash)}
.sel .tag{position:absolute;right:8px;top:8px;height:22px;padding:0 8px;border-radius:999px;background:var(--text);color:var(--plate);font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hover-tag{position:absolute;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-strong)}
.ref{border-radius:14px;background:var(--mock);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;text-align:center;padding:12px}
.x-pop{position:absolute;z-index:6;background:var(--overlay);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-radius:14px;box-shadow:var(--shadow-pop);padding:4px;font-size:13px}
.mi{height:34px;width:100%;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 10px;white-space:nowrap}
.mi svg.i{width:15px;height:15px;color:var(--text-2)}
.mi.on{background:var(--active)}
.mi .k{margin-left:auto;color:var(--text-3);font-size:12px}
.mi .ck{width:15px;color:var(--text)}
.msep{height:1px;background:var(--line);margin:4px 8px}
.mlab{font-size:12px;color:var(--text-3);padding:6px 10px 2px}
.mfield{height:34px;margin:2px 2px 4px;border-radius:10px;background:var(--hover);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--text-3)}
.look{position:absolute;z-index:3;right:10px;top:58px;width:268px;padding:6px;border-radius:14px;background:var(--overlay);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:2px}
.look .lh{height:34px;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px}
.look .lh b{font-weight:600}
.look .lh span{color:var(--text-3);font-size:12px}
.look .lr{display:flex;flex-direction:column;gap:6px;padding:8px 10px}
.look .lr .l{font-size:12px;color:var(--text-2)}
.look .sel2{height:32px;border-radius:10px;background:var(--hover);display:flex;align-items:center;padding:0 10px;gap:8px}
.look .sel2 .cv{margin-left:auto}
.look .said{font-size:12px;color:var(--text-3)}
.phone{width:390px;height:844px;flex:none;border-radius:44px;overflow:hidden;position:relative;background:var(--frame);box-shadow:0 0 0 1px var(--line-strong),0 30px 60px rgba(0,0,0,.12);display:flex;flex-direction:column}
.status{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600}
.status .bat{width:26px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--text-2);position:relative}
.status .bat:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:6px;border-radius:2px;background:var(--text)}
.phone .plate{margin:0 6px 6px;border-radius:30px}
.phone .bar{height:48px;padding:4px}
.phone .bar .x-ib{width:40px;height:40px}
.phone .pick{height:40px;font-size:15px;padding:0 10px 0 14px}
.phone .top{left:12px;right:12px;top:12px}
.phone .low{bottom:20px}
.home{position:absolute;z-index:9;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:999px;background:var(--text)}
.scrim{position:absolute;z-index:7;inset:0;background:var(--scrim)}
.sheet{position:absolute;z-index:8;left:6px;right:6px;bottom:6px;height:560px;border-radius:30px;background:var(--plate);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;padding:8px 10px 26px}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line-strong);margin:2px auto 10px;flex:none}
.sheet .x-seg{display:flex;margin:0 4px 6px}
.sheet .x-seg button{flex:1;height:34px;font-size:13px}
.sheet .row{height:44px;font-size:15px;border-radius:14px}
.sheet .row.lift{background:var(--active);box-shadow:none}
.side.float .row.lift{background:var(--active);box-shadow:none}
.sm.dark .sheet .row.lift{background:#2A2A2A}
.sheet .sh{height:36px;font-size:13px}
.board{display:flex;gap:40px;align-items:flex-start}
.board-cap{font-size:13px;color:var(--text-2);margin:0 0 12px 8px}
</style>
</helmet>
